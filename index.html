<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0E0D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Negative Archive</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/images/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/file-check.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">

    <!-- Zone: Header (56pt) -->
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-header-start">
          <button class="icon-button app-back" type="button" aria-label="Back" data-back hidden>
            <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h1 class="app-title" data-screen-title>Negatives</h1>
        </div>
        <!-- Action slot: filled per screen in later milestones -->
        <div class="app-header-actions" data-screen-actions></div>
      </div>
    </header>

    <!-- Zone: Content (scrolls). The router renders the screen here. -->
    <main class="app-content" data-screen>
      <!-- Shown by js/file-check.js when the page is opened as a file. The router replaces it. -->
      <div class="grid" data-file-warning hidden>
        <section class="span-4 stack-1">
          <h2 class="section-label">Can't start</h2>
          <div class="empty-state stack-1">
            <p>The app has to be opened from a local server, not as a file.</p>
            <p class="text-sm text-muted">In the Archivey folder run <code>python3 serve.py</code>, then open http://localhost:8000.</p>
          </div>
        </section>
      </div>
    </main>

    <!-- Zone: Tab bar (56pt + safe area) -->
    <nav class="app-tabbar" aria-label="Main">
      <div class="app-tabbar-inner">
        <a class="tab" href="#/feed" data-route="feed">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/></svg>
          Feed
        </a>
        <a class="tab" href="#/archive" data-route="archive">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18M8 4v16"/></svg>
          Archive
        </a>
        <a class="tab" href="#/shoot" data-route="shoot">
          <span class="tab-shoot-tile">
            <svg class="tab-icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          </span>
          Shoot
        </a>
        <a class="tab" href="#/add" data-route="add">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
          Add
        </a>
        <a class="tab" href="#/queue" data-route="queue">
          <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18h2"/></svg>
          Queue
        </a>
      </div>
    </nav>

  </div>
</body>
</html>
